<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>KNOPKA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="button.css">
</head>
<body>
    <!-- Начальный экран -->
    <div class="intro">
        <h1>Погрузись в мир кино!</h1>
    </div>

    <!-- Затемнение фона -->
    <div class="overlay"></div>

    <!-- Основной контент -->
    <div class="main-content">
        <header>
            <div class="header-left">
                <div class="menu-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="30" viewBox="0 0 40 30">
                        <rect width="40" height="6" fill="#ff69b4" rx="3" />
                        <rect y="12" width="40" height="6" fill="#ff69b4" rx="3" />
                        <rect y="24" width="40" height="6" fill="#ff69b4" rx="3" />
                    </svg>
                </div>
                <button class='glowing-btn'><span class='glowing-txt'>K<span class='faulty-letter'>N</span>OPKA</span></button>
            </div>
            <div class="search-container">
                <input type="text" class="search-bar" placeholder="Найди свой любимый фильм...">
            </div>
            <div class="auth-buttons">
                <button class="auth-btn login-btn">Log In</button>
                <button class="auth-btn signup-btn">Sign Up</button>
            </div>
        </header>

        <!-- Боковое меню -->
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="#" class="active">Главная</a></li>
                <li><a href="#">История</a></li>
                <li><a href="#">Понравившиеся</a></li>
                <li><a href="#">Смотреть позже</a></li>
            </ul>
        </aside>

        <div class="movies-container">
            <!-- Карточки фильмов -->
            <div class="movie-card">
                <img src="fight.png" alt="Movie 1">
                <div class="movie-info">
                    <h3 class="movie-title">Бойцовский клуб</h3>
                    <div class="movie-genre">Боевик • Драма • Криминал </div>
                </div>
            </div>
            <div class="movie-card">
                <img src="king.png" alt="Movie 2">
                <div class="movie-info">
                    <h3 class="movie-title">Tемный рыцарь</h3>
                    <div class="movie-genre">Боевик • Фэнтези • Приключения</div>
                </div>
            </div>
            <div class="movie-card">
                <img src="papa.jpg" alt="Movie 3">
                <div class="movie-info">
                    <h3 class="movie-title">Крестный отец</h3>
                    <div class="movie-genre">Драма • Детектив • Криминал </div>
                </div>
            </div>
            <div class="movie-card">
                <img src="pulp.png" alt="Movie 4">
                <div class="movie-info">
                    <h3 class="movie-title">Криминальное чтиво </h3>
                    <div class="movie-genre">Криминал • Драма • Комедия</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно для входа -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Log In</h2>
            <form>
                <label for="loginUsername">Логин</label>
                <input type="text" id="loginUsername" name="loginUsername" required>
                <label for="loginPassword">Пароль</label>
                <input type="password" id="loginPassword" name="loginPassword" required>
                <button type="submit">Войти</button>
            </form>
        </div>
    </div>

    <!-- Модальное окно для регистрации -->
    <div class="modal" id="signupModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Sign Up</h2>
            <form>
                <label for="signupUsername">Имя пользователя</label>
                <input type="text" id="signupUsername" name="signupUsername" required>
                <label for="signupLogin">Логин</label>
                <input type="text" id="signupLogin" name="signupLogin" required>
                <label for="signupPassword">Пароль</label>
                <input type="password" id="signupPassword" name="signupPassword" required>
                <label for="signupConfirmPassword">Подтвердите пароль</label>
                <input type="password" id="signupConfirmPassword" name="signupConfirmPassword" required>
                <button type="submit">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const intro = document.querySelector('.intro');
            const mainContent = document.querySelector('.main-content');
            const menuToggle = document.querySelector('.menu-toggle');
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.overlay');
            const loginBtn = document.querySelector('.login-btn');
            const signupBtn = document.querySelector('.signup-btn');
            const loginModal = document.getElementById('loginModal');
            const signupModal = document.getElementById('signupModal');
            const closeBtns = document.querySelectorAll('.close');

            // Обработка начального экрана
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    intro.classList.add('hidden');
                    mainContent.classList.add('visible');
                }
            });

            intro.addEventListener('click', () => {
                intro.classList.add('hidden');
                mainContent.classList.add('visible');
                window.scrollTo(0, 100);
            });

            // Обработка бокового меню
            menuToggle.addEventListener('click', () => {
                menuToggle.classList.toggle('active');
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            });

            // Закрытие меню при клике на overlay
            overlay.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            });

            // Открытие модального окна для входа
            loginBtn.addEventListener('click', () => {
                loginModal.style.display = 'block';
                overlay.style.display = 'block';
            });

            // Открытие модального окна для регистрации
            signupBtn.addEventListener('click', () => {
                signupModal.style.display = 'block';
                overlay.style.display = 'block';
            });

            // Закрытие модальных окон
            closeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    loginModal.style.display = 'none';
                    signupModal.style.display = 'none';
                    overlay.style.display = 'none';
                });
            });

            // Закрытие модальных окон при клике на overlay
            overlay.addEventListener('click', () => {
                loginModal.style.display = 'none';
                signupModal.style.display = 'none';
                overlay.style.display = 'none';
            });
        });
    </script>
</body>
</html>
